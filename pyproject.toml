[project]
name = "Explainable-AI-Demos-with-SHAP"
version = "2.0.0"
description = "Enterprise-grade explainable AI platform with SHAP, LIME, MLflow, FastAPI, and full MLOps stack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "XAI Platform Team" }
]
keywords = ["explainability", "xai", "shap", "lime", "mlops", "machine-learning", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core ML
    "numpy>=2.2.0",
    "pandas>=2.3.0",
    "scikit-learn>=1.7.0",
    "xgboost>=3.0.0",
    "lightgbm>=4.6.0",
    # Explainability
    "shap>=0.48.0",
    "lime>=0.2.0.1",
    # Hyperparameter optimisation
    "optuna>=4.5.0",
    # Deep learning
    "torch>=2.8.0",
    "tensorflow>=2.20.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Async
    "httpx>=0.28.0",
    # Cache
    "redis[asyncio]>=5.2.0",
    # MLOps
    "mlflow>=2.17.0",
    # Feature engineering
    "feature-engine>=1.9.3",
    # Monitoring
    "prometheus-client>=0.21.0",
    # Visualisation
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    # Utilities
    "scipy>=1.14.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
notebooks = [
    "ipykernel>=6.30.0",
    "ipython>=8.37.0",
    "kagglehub>=0.3.0",
]

[project.scripts]
xai-api = "src.api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ─── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "RET", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401", "S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

# ─── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = false

# ─── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks as integration tests",
    "asyncio: marks async tests",
]

# ─── coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise NotImplementedError"]
fail_under = 70
